[project]
name = "retrieval-arena"
version = "0.1.0"
description = "Compare retrieval strategies (dense, BM25, hybrid, rerank, long context, agentic) on a real dedup task."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arena-kit @ git+https://github.com/SeijiMatsumoto/arenas.git#subdirectory=kit",
  "httpx>=0.28.0",
  "numpy>=2.0.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
  "rich>=14.1.0",
]

[project.scripts]
arena = "retrieval_arena.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]
# Only needed to rebuild the dataset from the enable-ai database.
export = [
  "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_arena"]

[tool.ruff]
line-length = 100
